<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Google</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="top-nav">
    <a href="https://mail.google.com/">Gmail</a>
    <a href="https://www.google.com/imghp">Imágenes</a>
    <a class="apps-button" href="https://www.google.com/intl/es/about/products" aria-label="Aplicaciones de Google">⠿</a>
    <a class="sign-in" href="https://accounts.google.com/">Iniciar sesión</a>
  </header>

  <main>
    <h1 class="logo" aria-label="Google"><span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span></h1>
    <form class="search-form" action="https://www.google.com/search" method="get">
      <label class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.71.71l.27.28v.78L20 21.49 21.49 20 15.5 14Zm-5 0A4.5 4.5 0 1 1 10.5 5a4.5 4.5 0 0 1 0 9Z"/>
        </svg>
        <input class="search-input" type="search" name="q" aria-label="Buscar" autocomplete="off" autofocus>
      </label>
      <div class="buttons">
        <button class="search-button" type="submit">Buscar con Google</button>
        <button class="search-button" type="submit">Voy a tener suerte</button>
      </div>
    </form>
  </main>

  <footer>
    <div class="country">México</div>
    <nav class="footer-links" aria-label="Enlaces del pie de página">
      <div class="footer-group">
        <a href="https://about.google/">Sobre Google</a>
        <a href="https://ads.google.com/">Publicidad</a>
        <a href="https://www.google.com/services/">Negocios</a>
        <a href="https://www.google.com/search/howsearchworks/">Cómo funciona la Búsqueda</a>
      </div>
      <div class="footer-group">
        <a href="https://policies.google.com/privacy">Privacidad</a>
        <a href="https://policies.google.com/terms">Condiciones</a>
        <a href="https://www.google.com/preferences">Preferencias</a>
      </div>
    </nav>
  </footer>
</body>
</html>
